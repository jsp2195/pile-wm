name: small
seed: 42
device: auto
threads: 4
output: artifacts/small
trajectories: 500
steps: 40
data_batch_size: 16
sim:
  particles: 200
  particle_radius: 0.012
  pusher_radius: 0.04
  max_displacement: 0.04
