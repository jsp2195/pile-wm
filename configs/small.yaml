model:
  dim: 384
  depth: 6
  heads: 6
  context: 3
evaluation:
  trajectories: 50
  horizon: 30
  counterfactual_k: 8
  counterfactual_horizon: 10
  occupancy_threshold: 0.1
  shuffle_gap_threshold: 0.05
planning:
  episodes: 50
